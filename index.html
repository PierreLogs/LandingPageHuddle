<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Landing page for Huddle community platform"
    />
    <meta name="keywords" content="" />
    <meta name="author" content="Frontend Mentor Challenge | Pierre Logs" />
    <meta name="robots" content="index, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>
      Frontend Mentor | Huddle Landing Page with single introductory section
    </title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="mobile desktop">
      <header>
        <img src="./assets/logo.svg" alt="Huddle page Logo" class="logo" />
      </header>
      <main class="hero">
        <div class="hero__container">
          <div class="hero__content--left">
            <img
              src="./assets/illustration-mockups.svg"
              alt="illustration for Huddle"
              class="content__illustration"
            />
          </div>
          <div class="hero__content--right">
            <h1 class="content__title">
              Build The Community Your Fans Will Love
            </h1>
            <p class="content__description">
              Huddle re-imagines the way we build communities. You have a voice,
              but so does your audience. Create connections with your users as
              you engage in genuine discussion.
            </p>
            <button class="content__button" type="button">Register</button>
          </div>
        </div>
      </main>
      <footer>
        <div class="footer__social--links">
          <a
            href="https://www.facebook.com"
            target="_blank"
            aria-label="facebook page for Huddle"
            title="link to facebook page for Huddle"
          >
            <i class="fa-brands fa-facebook-f icon"></i>
          </a>
          <a
            href="https://www.twitter.com"
            target="_blank"
            aria-label="twitter page for Huddle"
            title="link to twitter page for Huddle"
          >
            <i class="fa-brands fa-twitter icon"></i>
          </a>
          <a
            href="https://www.instagram.com"
            target="_blank"
            aria-label="instagram page for Huddle"
            title="link to instagram page for Huddle"
          >
            <i class="fa-brands fa-instagram icon"></i>
          </a>
        </div>
        <div class="footer__attribution">
          <p class="attribution">
            Challenge by
            <a
              href="https://www.frontendmentor.io?ref=challenge"
              target="_blank"
              >Frontend Mentor</a
            >. Coded by <a href="#">PierreLogs</a>.
          </p>
        </div>
      </footer>
    </div>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/js/all.min.js"
      integrity="sha512-gBYquPLlR76UWqCwD06/xwal4so02RjIR0oyG1TIhSGwmBTRrIkQbaPehPF8iwuY9jFikDHMGEelt0DtY7jtvQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </body>
</html>
